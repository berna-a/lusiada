<svg
  preserveAspectRatio="xMidYMid slice"
  viewBox="0 0 800 600"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="parch" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#D9B077" />
      <stop offset="50%" stop-color="#A87C3E" />
      <stop offset="100%" stop-color="#6E4F26" />
    </linearGradient>
    <radialGradient cx="50%" cy="50%" id="vignette" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.45" />
    </radialGradient>
    <filter id="noise">
      <feTurbulence
        baseFrequency="0.9"
        numOctaves="2"
        seed="4"
        type="fractalNoise"
      />
      <feColorMatrix
        values="0 0 0 0 0.55  0 0 0 0 0.4  0 0 0 0 0.2  0 0 0 0.35 0"
      />
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>
  </defs>
  <rect fill="url(#parch)" height="600" width="800" />
  <rect filter="url(#noise)" height="600" opacity="0.7" width="800" />
  <g fill="none" stroke="#3A2710" stroke-opacity="0.18" stroke-width="0.5">
    <path d="M0 120 Q 200 100 400 130 T 800 110" />
    <path d="M0 240 Q 200 220 400 250 T 800 230" />
    <path d="M0 360 Q 200 340 400 370 T 800 350" />
    <path d="M0 480 Q 200 460 400 490 T 800 470" />
  </g>
  <rect fill="url(#vignette)" height="600" width="800" />
</svg>
