name: Deploy Staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Lint informativo enquanto o código legado (Lovable) não está limpo.
      - name: Lint (não bloqueante)
        run: bun run lint
        continue-on-error: true

  deploy-convex:
    name: Deploy Convex (produção)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex functions
        if: env.CONVEX_DEPLOY_KEY != ''
        run: bunx convex deploy -y

      - name: Aviso — falta CONVEX_DEPLOY_KEY
        if: env.CONVEX_DEPLOY_KEY == ''
        run: echo "::warning::CONVEX_DEPLOY_KEY não definido — deploy do Convex ignorado. Adicione o secret no repositório."
